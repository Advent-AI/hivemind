[pytest]
# The suite is tests/ alone. A bare `pytest` from the repository root would otherwise collect research scripts whose names match
# pytest's default patterns and run their top-level code on import: on 2026-11-01 it imported
# docs/research/2026-10-29-ledger-standard/test-set/finalize_test.py, which rebuilt the frozen test gold with the page's current
# version number (restored from Git, sha256 checked). The old poc/reports/2026-10-25-* studies' test files fail to import as well.
testpaths = tests
