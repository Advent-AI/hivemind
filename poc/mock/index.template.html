<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hivemind | Ideas &amp; Theses</title>
<link rel="stylesheet" href="../../web/design-system/fonts-embedded.css">
<style>__STYLES__</style>
</head>
<body class="hm-ui demo">
<header class="bar">
  <a class="wordmark" href="#"><img class="wordmark__logo" src="../../web/hivemind-logo.svg" alt="" aria-hidden="true"><span>Hivemind</span></a>
  <nav class="app-nav" aria-label="Workspace"><button id="show-library" type="button" aria-pressed="true">Thesis Library</button><button id="show-idea" type="button" aria-pressed="false">Explore Ideas</button></nav>
</header>
<main id="library" aria-label="Thesis library"></main>
<main id="explorer" aria-label="Thesis canvas" hidden>
  <div class="idea-entry">
  <form class="idea-form" id="idea-form">
    <div class="idea-composer">
      <input class="ask__input" id="ask" type="text" aria-label="Your idea" autocomplete="off" spellcheck="false" placeholder="Share an idea, e.g. Can NVIDIA's data center revenue top $300B this year?">
      <button class="idea-send" id="idea-send" type="submit" aria-label="Send idea" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
    </div>
  </form>
  <button class="idea-launcher" id="idea-launcher" type="button" aria-label="Enter a new idea" aria-controls="idea-form" aria-expanded="true" hidden><img src="../../web/hivemind-logo.svg" alt="" aria-hidden="true"></button>
  </div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script id="composite-trials" type="application/json">__COMPOSITE_TRIALS__</script>
<script id="market-data" type="application/json">__MARKET_DATA__</script>
<script>__SCRIPT__</script>
</body>
</html>
