<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Hivemind 系统设计</title>
  <link rel="icon" href="../../../web/hivemind-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../web/design-system/fonts-embedded.css">
  <link rel="stylesheet" href="../../../web/design-system/design-system.css">
  <link rel="stylesheet" href="system-design/page.css">
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="#new">Hivemind</a>
    <nav class="tickers" id="designTabs" aria-label="设计版本"></nav>
    <div class="bar__tools">
      <label class="field field--inline" id="profileField" hidden>
        <span class="field__label">运行配置</span>
        <span class="field__control"><select class="field__select" id="profileSelect"></select></span>
      </label>
    </div>
  </header>

  <main class="page">
    <section class="intro">
      <h1 class="intro__title" id="designHeading"></h1>
      <p class="intro__summary" id="designSummary"></p>
      <p class="intro__meta" id="designMeta"></p>
    </section>

    <div class="design" id="designPanel" hidden>
      <nav class="filters view-tabs" id="viewTabs" aria-label="视图"></nav>
      <div class="view-head">
        <h2 class="view-head__title" id="viewTitle"></h2>
        <p class="view-head__caption" id="viewCaption"></p>
      </div>
      <div class="banner" id="banner" hidden></div>

      <div class="workspace">
        <section class="diagram">
          <div class="legend" id="legend"></div>
          <div class="steps" id="steps"></div>
          <div class="viewport" id="viewport">
            <div class="canvas" id="canvas">
              <svg class="edges" id="edges"></svg>
              <div id="nodes"></div>
            </div>
          </div>
          <div class="diagram__tools">
            <p class="diagram__hint">点图上的模块或上面的序号查看详情；选中一个模块，它的连线会高亮。滚动可以移动整张图。</p>
            <div class="zoom">
              <button class="zoom__button" id="zoomOut" type="button">−</button>
              <span class="num zoom__label" id="zoomLabel">100%</span>
              <button class="zoom__button" id="zoomIn" type="button">+</button>
              <button class="text-button" id="zoomFit" type="button">适配宽度</button>
            </div>
          </div>
        </section>
        <aside class="detail" id="detail"></aside>
      </div>
    </div>

    <section class="migration" id="migration" hidden></section>
    <footer class="documents" id="documents"></footer>
  </main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet__scrim" id="sheetScrim"></div>
    <aside class="sheet__panel sheet__panel--wide" id="sheetPanel" tabindex="-1">
      <div class="sheet__top">
        <span class="label" id="sheetKicker"></span>
        <button class="text-button" id="sheetClose" type="button">关闭</button>
      </div>
      <div class="sheet__body" id="sheetBody"></div>
    </aside>
  </div>

  <script src="system-design/old-design.js"></script>
  <script src="system-design/old-drilldowns.js"></script>
  <script src="system-design/new-design.js"></script>
  <script src="system-design/new-classification.js"></script>
  <script src="system-design/new-config.js"></script>
  <script src="system-design/new-universe.js"></script>
  <script src="system-design/new-facts.js"></script>
  <script src="system-design/markdown.js"></script>
  <script src="system-design/prd-bundle.js"></script>
  <script src="system-design/render.js"></script>
</body>
</html>
